<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="pk-title pk-desc">
  <title id="pk-title">Panchakosha Vikas — Five Domains of Early Childhood Development (NCF-FS 2022)</title>
  <desc id="pk-desc">Five concentric/connected domains of child development under NCF-FS 2022: Annamaya (Physical), Pranamaya (Vital/Emotional), Manomaya (Mental/Cognitive), Vijnanamaya (Intellectual/Language), and Anandamaya (Aesthetic/Spiritual).</desc>
  <rect width="960" height="440" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="24" y="20" width="912" height="58" rx="12" fill="#165B33"/>
  <text x="480" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Panchakosha Vikas (ପଞ୍ଚକୋଷ ବିକାଶ) — NCF-FS 2022 5 Developmental Domains</text>
  <text x="480" y="66" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13">Holistic Early Childhood &amp; Primary Curriculum Framework (Ages 3–8)</text>

  <rect x="28" y="100" width="172" height="290" rx="14" fill="#FFFFFF" stroke="#165B33" stroke-width="1.5"/>
  <rect x="28" y="100" width="172" height="10" rx="5" fill="#165B33"/>
  <text x="114" y="136" text-anchor="middle" fill="#165B33" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Annamaya</text>
  <text x="114" y="156" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Physical &amp; Motor</text>
  <text x="114" y="176" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">(ଅନ୍ନମୟ କୋଷ)</text>
  <text x="114" y="210" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Gross &amp; fine motor</text>
  <text x="114" y="230" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Nutrition (MSPY)</text>
  <text x="114" y="250" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Hygiene &amp; Yoga</text>

  <rect x="212" y="100" width="172" height="290" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="212" y="100" width="172" height="10" rx="5" fill="#0F766E"/>
  <text x="298" y="136" text-anchor="middle" fill="#0F766E" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Pranamaya</text>
  <text x="298" y="156" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Vital &amp; Emotional</text>
  <text x="298" y="176" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">(ପ୍ରାଣମୟ କୋଷ)</text>
  <text x="298" y="210" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Self-regulation</text>
  <text x="298" y="230" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Empathy &amp; sharing</text>
  <text x="298" y="250" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Confidence &amp; play</text>

  <rect x="396" y="100" width="172" height="290" rx="14" fill="#FFFFFF" stroke="#0369A1" stroke-width="1.5"/>
  <rect x="396" y="100" width="172" height="10" rx="5" fill="#0369A1"/>
  <text x="482" y="136" text-anchor="middle" fill="#0369A1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Manomaya</text>
  <text x="482" y="156" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Mental &amp; Cognitive</text>
  <text x="482" y="176" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">(ମନୋମୟ କୋଷ)</text>
  <text x="482" y="210" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Memory &amp; sorting</text>
  <text x="482" y="230" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Pre-numeracy logic</text>
  <text x="482" y="250" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Curiosity &amp; puzzles</text>

  <rect x="580" y="100" width="172" height="290" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <rect x="580" y="100" width="172" height="10" rx="5" fill="#B45309"/>
  <text x="666" y="136" text-anchor="middle" fill="#B45309" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4. Vijnanamaya</text>
  <text x="666" y="156" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Language &amp; Intellect</text>
  <text x="666" y="176" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">(ବିଜ୍ଞାନମୟ କୋଷ)</text>
  <text x="666" y="210" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Odia &amp; English FLN</text>
  <text x="666" y="230" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Observation &amp; EVS</text>
  <text x="666" y="250" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Problem solving</text>

  <rect x="764" y="100" width="168" height="290" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="764" y="100" width="168" height="10" rx="5" fill="#7C3AED"/>
  <text x="848" y="136" text-anchor="middle" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="14" font-weight="700">5. Anandamaya</text>
  <text x="848" y="156" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Aesthetic &amp; Values</text>
  <text x="848" y="176" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">(ଆନନ୍ଦମୟ କୋଷ)</text>
  <text x="848" y="210" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Art, music &amp; dance</text>
  <text x="848" y="230" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Odisha folk stories</text>
  <text x="848" y="250" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">Joyful learning</text>

  <text x="480" y="420" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Common Sense Odisha (csodisha.com) · Aligned with NCF-FS 2022 &amp; OSEPA Nua Arunima</text>
</svg>
