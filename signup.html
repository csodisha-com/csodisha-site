<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Candidate Registration | Common Sense Odisha</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body {
      background: #090e18;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .auth-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-logo {
      display: inline-block;
      margin-bottom: 0.75rem;
    }
    .auth-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 0.25rem 0;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0;
    }
    .form-group {
      margin-bottom: 1.15rem;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .form-input {
      width: 100%;
      height: 42px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0 1rem;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #0d9488;
    }
    .btn-toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      user-select: none;
    }
    .btn-toggle-pw:hover, .btn-toggle-pw:focus-visible {
      color: #f8fafc;
      background: rgba(13, 148, 136, 0.2);
      border-color: #0d9488;
    }
    .form-hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.35rem;
      display: block;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.825rem;
      margin-bottom: 1.15rem;
      display: none;
    }
    .btn-submit {
      width: 100%;
      height: 46px;
      background: #0d9488;
      color: #ffffff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      background: #0f766e;
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-logo" title="Common Sense Odisha">
        <img src="/assets/images/cso-logo.svg" alt="Common Sense Odisha" width="110" height="38">
      </a>
      <h1 class="auth-title">Create Candidate Account</h1>
      <p class="auth-subtitle">Independent candidate workspace & syllabus tracker</p>
    </div>

    <form id="candidate-signup-form" novalidate>
      <div class="error-box" id="auth-error-msg" role="alert" aria-live="assertive"></div>

      <div class="form-group">
        <label for="signup-fullname" class="form-label">Full Name *</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="signup-fullname"
            name="fullName"
            class="form-input"
            placeholder="Subham Mohanty"
            autocomplete="name"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="signup-email" class="form-label">Email Address *</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="signup-email"
            name="email"
            class="form-input"
            placeholder="subham@example.com"
            autocomplete="email"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="signup-district" class="form-label">Home District *</label>
        <div class="input-wrapper">
          <select id="signup-district" name="district" class="form-input" style="cursor: pointer;">
            <option value="Balasore">Balasore</option>
            <option value="Bhadrak">Bhadrak</option>
            <option value="Cuttack">Cuttack</option>
            <option value="Khordha (Bhubaneswar)">Khordha (Bhubaneswar)</option>
            <option value="Ganjam">Ganjam</option>
            <option value="Puri">Puri</option>
            <option value="Sambalpur">Sambalpur</option>
            <option value="Sundargarh">Sundargarh</option>
            <option value="Mayurbhanj">Mayurbhanj</option>
            <option value="Angul">Angul</option>
            <option value="Dhenkanal">Dhenkanal</option>
            <option value="Kendrapara">Kendrapara</option>
            <option value="Jagatsinghpur">Jagatsinghpur</option>
            <option value="Jajpur">Jajpur</option>
            <option value="Bargarh">Bargarh</option>
            <option value="Balangir">Balangir</option>
            <option value="Kalahandi">Kalahandi</option>
            <option value="Koraput">Koraput</option>
            <option value="Rayagada">Rayagada</option>
            <option value="Keonjhar">Keonjhar</option>
            <option value="Jharsuguda">Jharsuguda</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-password" class="form-label">Password *</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="signup-password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          >
          <button
            type="button"
            class="btn-toggle-pw"
            id="btn-toggle-pw"
            aria-label="Show password"
            aria-pressed="false"
          >Show</button>
        </div>
        <span class="form-hint">8–128 characters with at least one uppercase letter, one lowercase letter, one digit and one special character.</span>
      </div>

      <!-- Honeypot: hidden from humans, catnip for bots. Any value = silent reject. -->
      <div style="position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden;" aria-hidden="true">
        <label for="signup-website">Website</label>
        <input type="text" id="signup-website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" class="btn-submit" id="btn-submit-auth">
        Create Candidate Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html">Sign In</a>
    </div>
  </div>

  <script src="/assets/cso-auth-client.js"></script>
  <script>
    (function() {
      const form = document.getElementById('candidate-signup-form');
      const nameInput = document.getElementById('signup-fullname');
      const emailInput = document.getElementById('signup-email');
      const districtInput = document.getElementById('signup-district');
      const pwInput = document.getElementById('signup-password');
      const togglePwBtn = document.getElementById('btn-toggle-pw');
      const errorBox = document.getElementById('auth-error-msg');
      const submitBtn = document.getElementById('btn-submit-auth');

      // Restore cached form data from sessionStorage
      try {
        const cached = sessionStorage.getItem('cso_signup_cache');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed.fullName) nameInput.value = parsed.fullName;
          if (parsed.email) emailInput.value = parsed.email;
          if (parsed.district) districtInput.value = parsed.district;
        }
      } catch (e) {}

      // Cache non-sensitive inputs on change
      [nameInput, emailInput, districtInput].forEach(inp => {
        inp?.addEventListener('input', () => {
          try {
            sessionStorage.setItem('cso_signup_cache', JSON.stringify({
              fullName: nameInput.value.trim(),
              email: emailInput.value.trim().toLowerCase(),
              district: districtInput.value
            }));
          } catch(e) {}
        });
      });

      // Password toggle
      togglePwBtn.addEventListener('click', function() {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        this.textContent = isPw ? 'Hide' : 'Show';
        this.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
        this.setAttribute('aria-pressed', isPw ? 'true' : 'false');
      });

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearError();

        const fullName = nameInput.value.trim();
        const email = emailInput.value.trim().toLowerCase();
        const district = districtInput.value;
        const password = pwInput.value;

        if (!fullName) {
          showError('Please enter your full name.');
          nameInput.focus();
          return;
        }

        if (!email || !email.includes('@')) {
          showError('Please enter a valid candidate email address.');
          emailInput.focus();
          return;
        }

        if (!password || password.length < 8 || password.length > 128) {
          showError('Password must be between 8 and 128 characters.');
          pwInput.focus();
          return;
        }
        if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
          showError('Password must include an uppercase letter, a lowercase letter, a digit and a special character.');
          pwInput.focus();
          return;
        }

        // Prevent double submission
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending verification code...';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fullName,
              email,
              district,
              password,
              targetStreams: ['opsc', 'ossc'],
              website: document.getElementById('signup-website')?.value || ''
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.success) {
            // Check if OTP verification is requested
            if (data.message && data.message.includes('Verification code sent')) {
              renderOtpStep(email);
              return;
            }

            submitBtn.textContent = 'Account created! Redirecting...';
            if (data.candidate) {
              const sessionPayload = {
                ...data.candidate,
                isAuthenticated: true
              };
              localStorage.setItem('cso_candidate_session_v1', JSON.stringify(sessionPayload));
              localStorage.setItem('cso_candidate_profile', JSON.stringify(sessionPayload));
            }
            if (data.token) {
              localStorage.setItem('cso_auth_token', data.token);
            }
            window.location.href = '/student-dashboard/';
          } else {
            localStorage.removeItem('cso_auth_token');
            localStorage.removeItem('cso_candidate_profile');
            localStorage.removeItem('cso_candidate_session_v1');
            showError(data.error || 'Failed to create candidate account. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Candidate Account';
          }
        } catch (err) {
          clearTimeout(timeoutId);
          localStorage.removeItem('cso_auth_token');
          localStorage.removeItem('cso_candidate_profile');
          localStorage.removeItem('cso_candidate_session_v1');
          showError(err.name === 'AbortError' ? 'Registration request timed out. Please try again.' : 'Unable to reach registration server. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Candidate Account';
        }
      });

      function renderOtpStep(email) {
        form.innerHTML = `
          <div style="text-align:center;margin-bottom:1.5rem;">
            <div style="font-size:2.5rem;margin-bottom:0.5rem;">📩</div>
            <h3 style="font-size:1.15rem;margin:0 0 0.5rem 0;color:var(--text, #f1f5f9);">Candidate Verification</h3>
            <p style="font-size:0.85rem;color:var(--text-muted, #94a3b8);margin:0;line-height:1.5;">
              We sent a 6-digit OTP &amp; instant magic link to<br>
              <strong style="color:var(--text, #f1f5f9);word-break:break-all;">${email}</strong>
            </p>
          </div>

          <div style="margin-bottom:1.5rem;">
            <label style="display:block;font-size:0.85rem;margin-bottom:0.75rem;font-weight:600;text-align:center;">Enter 6-Digit Code</label>
            <div id="cso-otp-boxes" style="display:flex;gap:8px;justify-content:center;margin-bottom:0.5rem;">
              <input type="text" class="cso-otp-digit form-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code" style="width:44px;height:52px;font-size:1.4rem;font-weight:700;text-align:center;padding:0;" data-index="0" autofocus required>
              <input type="text" class="cso-otp-digit form-input" maxlength="1" pattern="[0-9]" inputmode="numeric" style="width:44px;height:52px;font-size:1.4rem;font-weight:700;text-align:center;padding:0;" data-index="1" required>
              <input type="text" class="cso-otp-digit form-input" maxlength="1" pattern="[0-9]" inputmode="numeric" style="width:44px;height:52px;font-size:1.4rem;font-weight:700;text-align:center;padding:0;" data-index="2" required>
              <input type="text" class="cso-otp-digit form-input" maxlength="1" pattern="[0-9]" inputmode="numeric" style="width:44px;height:52px;font-size:1.4rem;font-weight:700;text-align:center;padding:0;" data-index="3" required>
              <input type="text" class="cso-otp-digit form-input" maxlength="1" pattern="[0-9]" inputmode="numeric" style="width:44px;height:52px;font-size:1.4rem;font-weight:700;text-align:center;padding:0;" data-index="4" required>
              <input type="text" class="cso-otp-digit form-input" maxlength="1" pattern="[0-9]" inputmode="numeric" style="width:44px;height:52px;font-size:1.4rem;font-weight:700;text-align:center;padding:0;" data-index="5" required>
            </div>
            <div style="text-align:center;font-size:0.75rem;color:var(--text-muted, #94a3b8);margin-top:0.5rem;">
              Paste your 6-digit code or check your inbox for the magic link.
            </div>
          </div>

          <button type="submit" class="btn-submit" id="btn-submit-otp" style="width:100%;margin-bottom:1rem;">
            Verify Code &amp; Complete Registration
          </button>

          <div style="text-align:center;">
            <button type="button" id="btn-resend-otp" class="btn-toggle-pw" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:0.85rem;padding:6px 12px;" disabled>
              Resend Code (<span id="resend-countdown">60</span>s)
            </button>
            <div style="margin-top:0.5rem;">
              <a href="/signup.html" style="color:var(--text-muted, #94a3b8);font-size:0.75rem;text-decoration:underline;">Start over with a different email</a>
            </div>
          </div>
        `;

        const digits = Array.from(document.querySelectorAll('.cso-otp-digit'));
        const submitOtpBtn = document.getElementById('btn-submit-otp');
        const resendBtn = document.getElementById('btn-resend-otp');
        const countdownSpan = document.getElementById('resend-countdown');

        digits[0]?.focus();

        // 60-second countdown ticker
        let timeLeft = 60;
        const ticker = setInterval(() => {
          timeLeft--;
          if (countdownSpan) countdownSpan.textContent = String(timeLeft);
          if (timeLeft <= 0) {
            clearInterval(ticker);
            if (resendBtn) {
              resendBtn.disabled = false;
              resendBtn.textContent = 'Resend Code';
            }
          }
        }, 1000);

        // Resend handler
        resendBtn.onclick = async function() {
          resendBtn.disabled = true;
          resendBtn.textContent = 'Resending...';
          clearError();

          try {
            const rRes = await fetch('/api/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, resend: true })
            });
            const rData = await rRes.json().catch(() => ({}));
            if (rRes.ok && rData.success) {
              timeLeft = 60;
              resendBtn.innerHTML = `Resend Code (<span id="resend-countdown">60</span>s)`;
              const newCountSpan = document.getElementById('resend-countdown');
              const newTicker = setInterval(() => {
                timeLeft--;
                if (newCountSpan) newCountSpan.textContent = String(timeLeft);
                if (timeLeft <= 0) {
                  clearInterval(newTicker);
                  resendBtn.disabled = false;
                  resendBtn.textContent = 'Resend Code';
                }
              }, 1000);
            } else {
              showError(rData.error || 'Please wait before requesting a new code.');
              resendBtn.disabled = false;
              resendBtn.textContent = 'Resend Code';
            }
          } catch(e) {
            showError('Unable to resend code. Please try again.');
            resendBtn.disabled = false;
            resendBtn.textContent = 'Resend Code';
          }
        };

        function getEnteredOtp() {
          return digits.map(d => d.value.trim()).join('');
        }

        // Auto progression and backspace navigation
        digits.forEach((digit, index) => {
          digit.addEventListener('input', function(e) {
            const val = this.value.replace(/\D/g, '');
            this.value = val ? val.charAt(0) : '';
            if (this.value && index < 5) {
              digits[index + 1].focus();
            }
            if (getEnteredOtp().length === 6) {
              triggerOtpSubmit();
            }
          });

          digit.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && index > 0) {
              digits[index - 1].focus();
              digits[index - 1].value = '';
            }
          });

          // Clipboard paste handler
          digit.addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
            if (text.length > 0) {
              for (let i = 0; i < text.length && i < 6; i++) {
                digits[i].value = text[i];
              }
              const targetIndex = Math.min(text.length, 5);
              digits[targetIndex].focus();
              if (text.length === 6) {
                triggerOtpSubmit();
              }
            }
          });
        });

        async function triggerOtpSubmit() {
          clearError();
          const code = getEnteredOtp();
          if (code.length !== 6) {
            showError('Please enter all 6 digits of the verification code.');
            return;
          }

          submitOtpBtn.disabled = true;
          submitOtpBtn.textContent = 'Verifying code...';

          const otpController = new AbortController();
          const otpTimeoutId = setTimeout(() => otpController.abort(), 10000);

          try {
            const vRes = await fetch('/api/auth/verify-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, code }),
              signal: otpController.signal
            });
            clearTimeout(otpTimeoutId);

            const vData = await vRes.json().catch(() => ({}));

            if (vRes.ok && vData.success) {
              submitOtpBtn.textContent = 'Verification successful! Redirecting...';
              try { sessionStorage.removeItem('cso_signup_cache'); } catch(e) {}

              // Sync the verified user into the client-side session cache
              const verifiedUser = vData.user || vData.candidate;
              if (verifiedUser) {
                const sessionPayload = {
                  id: verifiedUser.id,
                  fullName: verifiedUser.name || verifiedUser.fullName,
                  name: verifiedUser.name || verifiedUser.fullName,
                  email: verifiedUser.email,
                  phone: verifiedUser.phone || '',
                  district: verifiedUser.district || '',
                  role: verifiedUser.role || 'candidate',
                  isAuthenticated: true
                };
                localStorage.setItem('cso_candidate_session_v1', JSON.stringify(sessionPayload));
                localStorage.setItem('cso_candidate_profile', JSON.stringify(sessionPayload));
              }
              if (vData.sessionToken || vData.token) {
                localStorage.setItem('cso_auth_token', vData.sessionToken || vData.token);
              }

              // Redirect immediately to the verified dashboard
              const urlParams = new URLSearchParams(window.location.search);
              const redirectParam = urlParams.get('redirect');
              const targetUrl = (redirectParam && redirectParam.startsWith('/') && !redirectParam.startsWith('//'))
                ? redirectParam
                : (vData.redirect || '/student-dashboard/?verified=1');

              window.location.href = targetUrl;
            } else {
              showError(vData.error || 'Invalid or expired verification code.');
              submitOtpBtn.disabled = false;
              submitOtpBtn.textContent = 'Verify Code & Complete Registration';
            }
          } catch (verErr) {
            clearTimeout(otpTimeoutId);
            showError(verErr.name === 'AbortError' ? 'Verification request timed out. Please try again.' : 'Unable to connect to verification server. Please try again.');
            submitOtpBtn.disabled = false;
            submitOtpBtn.textContent = 'Verify Code & Complete Registration';
          }
        }

        form.onsubmit = function(ev) {
          ev.preventDefault();
          triggerOtpSubmit();
        };
      }

      // Auth modal handoff: arriving at signup.html?email=... means a dual-channel
      // code was just dispatched — render the OTP verification step directly.
      try {
        const handoffEmail = (new URLSearchParams(window.location.search).get('email') || '').trim().toLowerCase();
        if (handoffEmail && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(handoffEmail)) {
          renderOtpStep(handoffEmail);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
