<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Candidate Registration | Common Sense Odisha</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body {
      background: #090e18;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .auth-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-logo {
      display: inline-block;
      margin-bottom: 0.75rem;
    }
    .auth-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 0.25rem 0;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0;
    }
    .form-group {
      margin-bottom: 1.15rem;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .form-input {
      width: 100%;
      height: 42px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0 1rem;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #0d9488;
    }
    .btn-toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      user-select: none;
    }
    .btn-toggle-pw:hover, .btn-toggle-pw:focus-visible {
      color: #f8fafc;
      background: rgba(13, 148, 136, 0.2);
      border-color: #0d9488;
    }
    .form-hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.35rem;
      display: block;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.825rem;
      margin-bottom: 1.15rem;
      display: none;
    }
    .btn-submit {
      width: 100%;
      height: 46px;
      background: #0d9488;
      color: #ffffff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      background: #0f766e;
    }
    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-logo" title="Common Sense Odisha">
        <img src="/assets/images/cso-logo.svg" alt="Common Sense Odisha" width="110" height="38">
      </a>
      <h1 class="auth-title">Create Candidate Account</h1>
      <p class="auth-subtitle">Independent candidate workspace & syllabus tracker</p>
    </div>

    <form id="candidate-signup-form" novalidate>
      <div class="error-box" id="auth-error-msg" role="alert" aria-live="assertive"></div>

      <div class="form-group">
        <label for="signup-fullname" class="form-label">Full Name *</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="signup-fullname"
            name="fullName"
            class="form-input"
            placeholder="Subham Mohanty"
            autocomplete="name"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="signup-email" class="form-label">Email Address *</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="signup-email"
            name="email"
            class="form-input"
            placeholder="subham@example.com"
            autocomplete="email"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="signup-district" class="form-label">Home District *</label>
        <div class="input-wrapper">
          <select id="signup-district" name="district" class="form-input" style="cursor: pointer;">
            <option value="Balasore">Balasore</option>
            <option value="Bhadrak">Bhadrak</option>
            <option value="Cuttack">Cuttack</option>
            <option value="Khordha (Bhubaneswar)">Khordha (Bhubaneswar)</option>
            <option value="Ganjam">Ganjam</option>
            <option value="Puri">Puri</option>
            <option value="Sambalpur">Sambalpur</option>
            <option value="Sundargarh">Sundargarh</option>
            <option value="Mayurbhanj">Mayurbhanj</option>
            <option value="Angul">Angul</option>
            <option value="Dhenkanal">Dhenkanal</option>
            <option value="Kendrapara">Kendrapara</option>
            <option value="Jagatsinghpur">Jagatsinghpur</option>
            <option value="Jajpur">Jajpur</option>
            <option value="Bargarh">Bargarh</option>
            <option value="Balangir">Balangir</option>
            <option value="Kalahandi">Kalahandi</option>
            <option value="Koraput">Koraput</option>
            <option value="Rayagada">Rayagada</option>
            <option value="Keonjhar">Keonjhar</option>
            <option value="Jharsuguda">Jharsuguda</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-password" class="form-label">Password *</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="signup-password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          >
          <button
            type="button"
            class="btn-toggle-pw"
            id="btn-toggle-pw"
            aria-label="Show password"
            aria-pressed="false"
          >Show</button>
        </div>
        <span class="form-hint">Must be between 8 and 64 characters in length.</span>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit-auth">
        Create Candidate Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html">Sign In</a>
    </div>
  </div>

  <script src="/assets/cso-auth-client.js"></script>
  <script>
    (function() {
      const form = document.getElementById('candidate-signup-form');
      const nameInput = document.getElementById('signup-fullname');
      const emailInput = document.getElementById('signup-email');
      const districtInput = document.getElementById('signup-district');
      const pwInput = document.getElementById('signup-password');
      const togglePwBtn = document.getElementById('btn-toggle-pw');
      const errorBox = document.getElementById('auth-error-msg');
      const submitBtn = document.getElementById('btn-submit-auth');

      // Password toggle
      togglePwBtn.addEventListener('click', function() {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        this.textContent = isPw ? 'Hide' : 'Show';
        this.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
        this.setAttribute('aria-pressed', isPw ? 'true' : 'false');
      });

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearError();

        const fullName = nameInput.value.trim();
        const email = emailInput.value.trim().toLowerCase();
        const district = districtInput.value;
        const password = pwInput.value;

        if (!fullName) {
          showError('Please enter your full name.');
          nameInput.focus();
          return;
        }

        if (!email || !email.includes('@')) {
          showError('Please enter a valid candidate email address.');
          emailInput.focus();
          return;
        }

        if (!password || password.length < 8 || password.length > 64) {
          showError('Password must be between 8 and 64 characters.');
          pwInput.focus();
          return;
        }

        // Prevent double submission
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending verification code...';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fullName,
              email,
              district,
              password,
              targetStreams: ['opsc', 'ossc']
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.success) {
            // Check if OTP verification is requested
            if (data.message && data.message.includes('Verification code sent')) {
              renderOtpStep(email, fullName, district);
              return;
            }

            submitBtn.textContent = 'Account created! Redirecting...';
            if (data.candidate) {
              const sessionPayload = {
                ...data.candidate,
                isAuthenticated: true
              };
              localStorage.setItem('cso_candidate_session_v1', JSON.stringify(sessionPayload));
              localStorage.setItem('cso_candidate_profile', JSON.stringify(sessionPayload));
            }
            if (data.token) {
              localStorage.setItem('cso_auth_token', data.token);
            }
            window.location.href = '/student-dashboard/';
          } else {
            localStorage.removeItem('cso_auth_token');
            localStorage.removeItem('cso_candidate_profile');
            localStorage.removeItem('cso_candidate_session_v1');
            showError(data.error || 'Failed to create candidate account. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Candidate Account';
          }
        } catch (err) {
          clearTimeout(timeoutId);
          localStorage.removeItem('cso_auth_token');
          localStorage.removeItem('cso_candidate_profile');
          localStorage.removeItem('cso_candidate_session_v1');
          showError(err.name === 'AbortError' ? 'Registration request timed out. Please try again.' : 'Unable to reach registration server. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Candidate Account';
        }
      });

      function renderOtpStep(email, fullName, district) {
        form.innerHTML = `
          <div style="text-align:center;margin-bottom:1.25rem;">
            <div style="font-size:2rem;margin-bottom:0.5rem;">📩</div>
            <h3 style="font-size:1.1rem;margin:0 0 0.5rem 0;color:var(--text, #f1f5f9);">Verify Your Email</h3>
            <p style="font-size:0.85rem;color:var(--text-muted, #94a3b8);margin:0;line-height:1.4;">
              We sent a 6-digit verification code to<br><strong style="color:var(--text, #f1f5f9);">${email}</strong>
            </p>
          </div>

          <div class="form-group" style="margin-bottom:1.25rem;">
            <label for="otp-input" style="display:block;font-size:0.85rem;margin-bottom:0.35rem;font-weight:600;">6-Digit Verification Code</label>
            <input
              type="text"
              id="otp-input"
              class="form-input"
              placeholder="123456"
              maxlength="6"
              pattern="[0-9]{6}"
              inputmode="numeric"
              autocomplete="one-time-code"
              required
              style="font-size:1.2rem;letter-spacing:0.25em;text-align:center;"
            >
            <span class="form-hint">Code expires in 15 minutes.</span>
          </div>

          <button type="submit" class="btn-submit" id="btn-submit-otp" style="width:100%;">
            Verify Code &amp; Complete Sign In
          </button>
        `;

        const otpInput = document.getElementById('otp-input');
        const submitOtpBtn = document.getElementById('btn-submit-otp');
        otpInput.focus();

        form.onsubmit = async function(ev) {
          ev.preventDefault();
          clearError();

          const code = otpInput.value.trim();
          if (!/^[0-9]{6}$/.test(code)) {
            showError('Please enter a valid 6-digit numeric verification code.');
            otpInput.focus();
            return;
          }

          submitOtpBtn.disabled = true;
          submitOtpBtn.textContent = 'Verifying code...';

          const otpController = new AbortController();
          const otpTimeoutId = setTimeout(() => otpController.abort(), 10000);

          try {
            const vRes = await fetch('/api/auth/verify-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, code }),
              signal: otpController.signal
            });
            clearTimeout(otpTimeoutId);

            const vData = await vRes.json().catch(() => ({}));

            if (vRes.ok && vData.success) {
              submitOtpBtn.textContent = 'Verification successful! Redirecting...';
              if (vData.candidate) {
                const sessionPayload = {
                  ...vData.candidate,
                  isAuthenticated: true
                };
                localStorage.setItem('cso_candidate_session_v1', JSON.stringify(sessionPayload));
                localStorage.setItem('cso_candidate_profile', JSON.stringify(sessionPayload));
              }
              if (vData.token) {
                localStorage.setItem('cso_auth_token', vData.token);
              }

              const urlParams = new URLSearchParams(window.location.search);
              const redirectParam = urlParams.get('redirect');
              const targetUrl = (redirectParam && redirectParam.startsWith('/') && !redirectParam.startsWith('//'))
                ? redirectParam
                : '/student-dashboard/';

              window.location.href = targetUrl;
            } else {
              showError(vData.error || 'Invalid or expired verification code.');
              submitOtpBtn.disabled = false;
              submitOtpBtn.textContent = 'Verify Code & Complete Sign In';
            }
          } catch (verErr) {
            clearTimeout(otpTimeoutId);
            showError(verErr.name === 'AbortError' ? 'Verification request timed out. Please try again.' : 'Unable to connect to verification server. Please try again.');
            submitOtpBtn.disabled = false;
            submitOtpBtn.textContent = 'Verify Code & Complete Sign In';
          }
        };
      }
      });
    })();
  </script>
</body>
</html>
