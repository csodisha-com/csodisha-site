<!DOCTYPE html>
<html lang="en" class="cso-studio-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <title>CS Odisha — Editorial Studio</title>
  <link rel="icon" href="/assets/img/favicon-32x32.png" type="image/png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/admin/suite.css?v=20261113">
  <link rel="stylesheet" href="/admin/cms/cms-embed.css?v=20261114g">
  <link rel="stylesheet" href="/admin/studio.css?v=20261122v199">
  <link rel="stylesheet" href="/admin/cms/security.css?v=20261114i">
  <link rel="stylesheet" href="/admin/edu-resources-batch1.css?v=20261117n">
</head>
<body class="cso-studio-body cso-compact-studio">

  <header class="cso-topbar cso-compact-topbar">
    <div class="cso-topbar-left">
      <div id="brandHomeBtn" class="cso-brand" role="button" tabindex="0" aria-label="CS Odisha Studio Home">
        <img src="/assets/img/cso-logo-96.webp" alt="Common Sense Odisha Logo" class="cso-brand-mark cso-brand-emblem" width="36" height="36">
        <div class="cso-brand-text">
          <div class="cso-brand-title-row">
            <span class="cso-brand-name">CS Odisha</span>
            <span class="cso-brand-badge">Studio</span>
          </div>
        </div>
      </div>
    </div>

    <nav id="csoAdminTabs" class="cso-compact-tabs" role="tablist" aria-label="Studio Sections">
      <button type="button" class="cso-compact-tab is-active" role="tab" aria-selected="true" data-admin-tab="jobs">Jobs &amp; .gov.in Queue</button>
      <button type="button" class="cso-compact-tab" role="tab" aria-selected="false" data-admin-tab="schemes-study">Schemes &amp; Study</button>
      <button type="button" class="cso-compact-tab" role="tab" aria-selected="false" data-admin-tab="system-ops">System &amp; Ops</button>
    </nav>

    <div class="cso-topbar-right">
      <a href="/" target="_blank" rel="noopener noreferrer" class="cso-pill-link">Live Site ↗</a>
      <span id="adminUserEmail" class="cso-user-email">Staff</span>
      <button id="btnSignOut" type="button" title="Sign Out" class="cso-icon-btn cso-signout-btn" aria-label="Sign Out">Sign Out</button>
    </div>
  </header>

  <main class="cso-main cso-compact-main">
    <div id="moduleHeaderActions" class="cso-subheader-actions"></div>
    <div id="workspaceRoot" class="cso-workspace cso-compact-workspace"></div>
  </main>

  <div id="toastContainer" class="cso-toast-container" aria-live="polite"></div>

  <div id="globalModal" class="cso-global-modal" hidden>
    <div class="cso-global-modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="cso-global-modal-head">
        <h3 id="modalTitle" class="cso-global-modal-title">Modal</h3>
        <button id="btnModalClose" type="button" class="cso-icon-btn" aria-label="Close modal">&times;</button>
      </div>
      <div id="modalBody" class="cso-global-modal-body"></div>
      <div id="modalFooter" class="cso-global-modal-foot"></div>
    </div>
  </div>

  <script src="/admin/suite-boot.js?v=20261114i"></script>
  <script src="/admin/charts.js?v=20261114"></script>
  <script src="/admin/fast-publish.js?v=20261122v199"></script>
  <script src="/admin/cms/cms.js?v=20261122v199"></script>
  <script src="/admin/lazy-suite-loader.js?v=20261117ao"></script>
  <script src="/admin/modules-restored.js?v=20261117ao"></script>
  <script src="/admin/suite-live.js?v=20261117ao"></script>
  <script src="/admin/admin.js?v=20261122v199"></script>
</body>
</html>
