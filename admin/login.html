<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Authentication | Common Sense Odisha</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --admin-bg: #081220;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(15, 169, 104, 0.25);
      --card-border-subtle: rgba(255, 255, 255, 0.08);
      --emerald: #0fa968;
      --emerald-hover: #0d9259;
      --emerald-glow: rgba(15, 169, 104, 0.28);
      --input-bg: #1e293b;
      --input-border: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-label: #cbd5e1;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.35);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--admin-bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(15, 169, 104, 0.15), transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(3, 72, 39, 0.2), transparent 40%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    .login-container {
      max-width: 440px;
      width: 100%;
      margin: auto;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--card-border-subtle);
      display: flex;
      flex-direction: column;
    }

    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .login-logo-link:hover {
      transform: scale(1.03);
    }

    .login-logo {
      height: 44px;
      width: auto;
      display: block;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 169, 104, 0.12);
      border: 1px solid rgba(15, 169, 104, 0.4);
      color: var(--emerald);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.45;
      max-width: 340px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: block;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .form-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 0.625rem;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      width: 100%;
      height: 48px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-glow);
    }

    .form-input.has-toggle {
      padding-right: 4.8rem;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
      z-index: 2;
      line-height: 1;
    }

    .btn-toggle-pw:hover, .btn-toggle-pw:focus-visible {
      color: var(--text-primary);
      background: rgba(15, 169, 104, 0.2);
      border-color: var(--emerald);
      outline: none;
    }
      color: var(--text-primary);
      outline: none;
    }

    .remember-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-label);
      cursor: pointer;
      user-select: none;
      margin-top: -0.25rem;
    }

    .remember-group input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--emerald);
      cursor: pointer;
      border-radius: 4px;
    }

    .login-error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
      font-size: 0.825rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      border-radius: 0.625rem;
      font-weight: 600;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--emerald);
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(15, 169, 104, 0.35);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--emerald-hover);
      box-shadow: 0 6px 18px rgba(15, 169, 104, 0.45);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .login-footer-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.825rem;
      gap: 12px;
    }

    .footer-link {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .footer-link:hover, .footer-link:focus-visible {
      color: var(--emerald);
      text-decoration: underline;
      outline: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .login-card {
        padding: 2rem 1.25rem;
      }
      .login-title {
        font-size: 1.35rem;
      }
      .login-footer-links {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <header class="login-header">
        <a href="/" class="login-logo-link" title="Return to CSO Homepage">
          <img src="/assets/images/cso-logo.svg" alt="Common Sense Odisha" class="login-logo" width="130" height="44">
        </a>

        <div class="login-badge">
          <span aria-hidden="true">🛡️</span>
          <span>Restricted Management Gate</span>
        </div>

        <h1 class="login-title">Administrator Sign In</h1>
        <p class="login-subtitle">
          Authorised access only. Verify your administrator identity to access inquiries, broadcasts, and system controls.
        </p>
      </header>

      <form class="login-form" id="admin-login-form" novalidate>
        <div class="form-group">
          <label for="admin-email" class="form-label">Administrator Email</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="admin-email"
              class="form-input"
              value="admin@csodisha.com"
              placeholder="admin@csodisha.com"
              required
              autocomplete="username"
              spellcheck="false"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="admin-passkey" class="form-label">Administrator Passkey / Bearer Token</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="admin-passkey"
              class="form-input has-toggle"
              placeholder="Enter passkey (e.g. Admin@CSO#2026)"
              required
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-pw" id="toggle-passkey" aria-label="Show passkey">
              Show
            </button>
          </div>
        </div>

        <label class="remember-group" for="remember-me">
          <input type="checkbox" id="remember-me">
          <span>Stay signed in for 8 hours on this device</span>
        </label>

        <div class="login-error" id="login-error-msg" role="alert" style="display: none;"></div>

        <button type="submit" class="btn-submit" id="btn-submit-login">
          <span>Authenticate &amp; Open Dashboard</span>
          <span aria-hidden="true">&rarr;</span>
        </button>
      </form>

      <footer class="login-footer-links">
        <a href="/" class="footer-link">&larr; Return to Public Portal</a>
        <a href="mailto:admin@csodisha.com" class="footer-link">Need Key Assistance?</a>
      </footer>
    </div>
  </div>

  <script>
    (function() {
      'use strict';
      const TARGET_EMAIL = 'admin@csodisha.com';
      const TARGET_PASSKEY = 'Admin@CSO#2026';

      const form = document.getElementById('admin-login-form');
      const emailInput = document.getElementById('admin-email');
      const passInput = document.getElementById('admin-passkey');
      const toggleBtn = document.getElementById('toggle-passkey');
      const rememberCheckbox = document.getElementById('remember-me');
      const errorMsg = document.getElementById('login-error-msg');
      const submitBtn = document.getElementById('btn-submit-login');

      // Toggle passkey visibility
      toggleBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        toggleBtn.textContent = isPass ? 'Hide' : 'Show';
        toggleBtn.setAttribute('aria-label', isPass ? 'Hide passkey' : 'Show passkey');
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        errorMsg.textContent = '';

        const email = (emailInput.value || '').trim().toLowerCase();
        const passkey = (passInput.value || '').trim();

        if (!email || !passkey) {
          errorMsg.style.display = 'flex';
          errorMsg.textContent = 'Please enter both administrator email and passkey.';
          return;
        }

        // Validate credentials
        if (email !== TARGET_EMAIL || passkey !== TARGET_PASSKEY) {
          errorMsg.style.display = 'flex';
          errorMsg.textContent = 'Invalid administrator credentials. Authorised access only.';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying Session...</span>';

        // Store verification token
        const tokenVal = 'cso_adm_verified_session';
        const sessionData = JSON.stringify({
          user: TARGET_EMAIL,
          token: tokenVal,
          loginAt: Date.now()
        });

        sessionStorage.setItem('cso_admin_token', tokenVal);
        sessionStorage.setItem('cso_admin_session', sessionData);

        if (rememberCheckbox && rememberCheckbox.checked) {
          localStorage.setItem('cso_admin_token', tokenVal);
          localStorage.setItem('cso_admin_session', sessionData);
        }

        window.location.href = '/admin/';
      });
    })();
  </script>
</body>
</html>
