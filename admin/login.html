<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff sign-in — CS Odisha Admin</title>
  <link rel="stylesheet" href="/admin/cms/cms.css?v=20261113-glow4">
</head>
<body class="login-body">
  <main class="login-card" aria-labelledby="t">
    <div class="cso-login-head">
      <a href="/" class="cso-login-logo-link" aria-label="Return to Common Sense Odisha Home" title="Return to Common Sense Odisha Home">
        <img src="/assets/images/cso-logo.svg" alt="Common Sense Odisha" width="130" height="44">
      </a>
      <div id="themeMenuWrap" class="cso-theme-menu-wrap">
        <button type="button" id="themeMenuBtn" class="cso-theme-icon-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Switch Studio Theme" title="Switch Studio Theme (Alt+T)">◐ ▾</button>
        <div id="themeMenuPopover" class="cso-theme-popover" role="menu" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" class="cso-theme-option" data-theme-value="apex"><span class="cso-theme-swatch is-apex" aria-hidden="true"></span><span>Apex Carbon (Dark)</span></button>
          <button type="button" role="menuitemradio" aria-checked="false" class="cso-theme-option" data-theme-value="volt"><span class="cso-theme-swatch is-volt" aria-hidden="true"></span><span>Volt Noir (Dark)</span></button>
          <button type="button" role="menuitemradio" aria-checked="false" class="cso-theme-option" data-theme-value="cobalt"><span class="cso-theme-swatch is-cobalt" aria-hidden="true"></span><span>Cobalt Enterprise (Light)</span></button>
          <button type="button" role="menuitemradio" aria-checked="false" class="cso-theme-option" data-theme-value="lime"><span class="cso-theme-swatch is-lime" aria-hidden="true"></span><span>Botanical Light (Light)</span></button>
        </div>
      </div>
    </div>
    <h1 id="t">Staff sign-in</h1>
    <p class="muted">Editors and administrators only. Use your CS Odisha account.</p>
    <div id="msg" class="alert" role="alert" hidden></div>
    <form id="f" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <div class="cso-pw-wrap">
        <input id="pw" name="password" type="password" autocomplete="current-password" required>
        <button id="togglePw" type="button" class="cso-pw-toggle" aria-label="Show password">Show</button>
      </div>
      <p id="capsHint" class="cso-caps-hint" hidden>Caps Lock is on</p>
      <label class="cso-remember-row">
        <input id="rememberMe" name="remember_me" type="checkbox">
        <span>Keep me signed in on this device</span>
      </label>
      <button class="btn primary block" id="go" type="submit">Sign in</button>
    </form>
    <div class="cso-login-footer">
      <a href="/" class="cso-login-home-link" title="Return to Common Sense Odisha Public Portal">← Back to Common Sense Odisha Home</a>
    </div>
  </main>
  <script src="/admin/cms/login.js"></script>
</body>
</html>
