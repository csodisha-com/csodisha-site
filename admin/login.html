<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff sign-in — CS Odisha Admin</title>
  <link rel="canonical" href="https://csodisha.com/admin/login.html">
  <link rel="stylesheet" href="/assets/css/cso-themes.css?v=20261125v300">
  <link rel="stylesheet" href="/admin/cms/cms.css?v=20261124v241">
  <link rel="stylesheet" href="/admin/cms/security.css?v=20261114h">
</head>
<body class="login-body">
<a class="cso-skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" class="login-card" aria-labelledby="t">
    <div class="cso-login-head">
      <a href="/" class="cso-login-logo-link" aria-label="Return to Common Sense Odisha Home" title="Return to Common Sense Odisha Home">
        <img src="/assets/img/cso-logo-96.webp" alt="Common Sense Odisha" width="130" height="44" loading="lazy" decoding="async">
      </a>
      <div id="themeMenuWrap" class="cso-theme-menu-wrap">
        <button type="button" id="themeMenuBtn" class="cso-theme-icon-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Switch Theme" title="Switch Theme (Alt+T)">◐ ▾</button>
        <div id="themeMenuPopover" class="cso-theme-popover" role="menu" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" class="cso-theme-option" data-theme-value="system"><span class="cso-theme-swatch is-system" aria-hidden="true"></span><span>System (Auto Light/Dark)</span></button>
          <button type="button" role="menuitemradio" aria-checked="false" class="cso-theme-option" data-theme-value="dark"><span class="cso-theme-swatch is-dark" aria-hidden="true"></span><span>Dark Night</span></button>
          <button type="button" role="menuitemradio" aria-checked="false" class="cso-theme-option" data-theme-value="reading"><span class="cso-theme-swatch is-reading" aria-hidden="true"></span><span>Reading Mode</span></button>
          <button type="button" role="menuitemradio" aria-checked="false" class="cso-theme-option" data-theme-value="utkal-bharat"><span class="cso-theme-swatch is-utkal-bharat" aria-hidden="true"></span><span>Odisha &amp; Bharat</span></button>
        </div>
      </div>
    </div>
    <h1 id="t">Staff sign-in</h1>
    <p class="muted">Editors and administrators only. Use your CS Odisha account.</p>
    <div id="msg" class="alert" role="alert" hidden></div>
    <form id="f" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <div class="cso-pw-wrap">
        <input id="pw" name="password" type="password" autocomplete="current-password" required>
        <button id="togglePw" type="button" class="cso-pw-toggle" aria-label="Show password">Show</button>
      </div>
      <p id="capsHint" class="cso-caps-hint" hidden>Caps Lock is on</p>
      <div class="cso-2fa-block" id="twofaBlock">
        <label for="twofa">2FA / Backup Code <span class="muted">(if enabled)</span></label>
        <input id="twofa" name="twofa_code" type="text" inputmode="text" autocomplete="one-time-code" maxlength="12" spellcheck="false" autocapitalize="characters" placeholder="123456 or XXXX-XXXX">
        <div class="cso-otp-row">
          <button id="sendOtp" type="button" class="btn cso-otp-btn">Send OTP (Telegram / Email)</button>
          <span id="otpStatus" class="cso-otp-status" role="status" aria-live="polite"></span>
        </div>
      </div>
      <label class="cso-remember-row" for="rememberMe">
        <input id="rememberMe" name="remember_me" type="checkbox">
        <span>Keep me signed in on this device</span>
      </label>
      <button class="btn primary block" id="go" type="submit">Sign in</button>
    </form>
    <div class="cso-login-footer">
      <a href="/" class="cso-login-home-link" title="Return to Common Sense Odisha Public Portal">← Back to Common Sense Odisha Home</a>
    </div>
  </main>
  <script src="/admin/cms/login.js" defer></script>
</body>
</html>
