<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Set New Password | Common Sense Odisha</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body {
      background: #090e18;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .auth-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 2.25rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }
    .auth-header { text-align: center; margin-bottom: 1.75rem; }
    .auth-logo { display: inline-block; margin-bottom: 0.75rem; }
    .auth-title {
      font-size: 1.35rem; font-weight: 700; color: #f8fafc;
      margin: 0 0 0.25rem 0;
    }
    .auth-subtitle { font-size: 0.85rem; color: #94a3b8; margin: 0; }
    .form-group { margin-bottom: 1.25rem; text-align: left; }
    .form-label {
      display: block; font-size: 0.85rem; font-weight: 600;
      color: #cbd5e1; margin-bottom: 0.4rem;
    }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .form-input {
      width: 100%; height: 44px; background: #020617;
      border: 1px solid #334155; border-radius: 0.5rem;
      padding: 0 1rem; color: #f8fafc; font-size: 0.95rem;
      outline: none; box-sizing: border-box; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: #0d9488; }
    .btn-toggle-pw {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #94a3b8; border-radius: 6px; padding: 4px 10px;
      font-size: 0.75rem; cursor: pointer; user-select: none;
    }
    .btn-toggle-pw:hover, .btn-toggle-pw:focus-visible {
      color: #f8fafc; background: rgba(13,148,136,0.2); border-color: #0d9488;
    }
    .error-box {
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5; padding: 0.75rem 1rem; border-radius: 0.5rem;
      font-size: 0.825rem; margin-bottom: 1.25rem; display: none;
    }
    .status-box {
      background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3);
      color: #7dd3fc; padding: 0.75rem 1rem; border-radius: 0.5rem;
      font-size: 0.825rem; margin-bottom: 1.25rem; display: none; text-align: center;
    }
    .btn-submit {
      width: 100%; height: 46px; background: #0d9488; color: #ffffff;
      border: none; border-radius: 0.5rem; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }
    .btn-submit:hover:not(:disabled) { background: #0f766e; }
    .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }
    .pw-hint {
      display: block; font-size: 0.7rem; color: #64748b; margin-top: 0.3rem;
    }
    .auth-links {
      text-align: center; margin-top: 1.25rem; font-size: 0.8rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .auth-links a {
      color: #38bdf8; text-decoration: none; font-weight: 600;
    }
    .auth-links a:hover { text-decoration: underline; }
    .auth-links .back-home { color: #94a3b8; }
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-logo" title="Common Sense Odisha">
        <img src="/assets/images/cso-logo.svg" alt="Common Sense Odisha" width="110" height="38">
      </a>
      <h1 class="auth-title" id="page-title">Set New Password</h1>
      <p class="auth-subtitle" id="page-subtitle">Validating your one-click reset link…</p>
    </div>

    <!-- Validating state -->
    <div class="screen active" id="screen-validating">
      <div class="status-box" id="validating-status" style="display:block;">Validating your reset link…</div>
    </div>

    <!-- Invalid token state -->
    <div class="screen" id="screen-invalid">
      <div class="error-box" id="invalid-error" style="display:block; text-align:center;">
        This password reset link is invalid, expired or already used.
      </div>
      <button type="button" class="btn-submit" onclick="window.location.href='/login.html'">
        Request a New Reset Link
      </button>
      <div class="auth-links">
        <a href="/">← Back to Home</a>
      </div>
    </div>

    <!-- Valid token: set new password -->
    <div class="screen" id="screen-setpw">
      <form id="reset-form" novalidate>
        <div class="error-box" id="reset-error" role="alert" aria-live="assertive"></div>

        <div class="form-group">
          <label for="new-password" class="form-label">New Password *</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="new-password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            >
            <button type="button" class="btn-toggle-pw" id="btn-toggle-newpw"
              aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <span class="pw-hint">Min 8 chars with upper &amp; lower case, a digit and a special character.</span>
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm New Password *</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm-password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit-reset">
          Set New Password
        </button>
      </form>
    </div>

    <div class="auth-links">
      <a href="/login.html">← Back to Sign In</a>
      <a href="/" class="back-home">← Back to Home</a>
    </div>
  </div>

  <script>
    (function() {
      const token = new URLSearchParams(window.location.search).get('token') || '';

      function show(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      function wirePwToggle(btn, input) {
        btn.addEventListener('click', function() {
          const isPw = input.type === 'password';
          input.type = isPw ? 'text' : 'password';
          btn.textContent = isPw ? 'Hide' : 'Show';
          btn.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
          btn.setAttribute('aria-pressed', isPw ? 'true' : 'false');
        });
      }
      wirePwToggle(document.getElementById('btn-toggle-newpw'), document.getElementById('new-password'));

      function showError(msg) {
        const box = document.getElementById('reset-error');
        box.textContent = msg;
        box.style.display = 'block';
      }

      // Validate the magic-link token before revealing the password fields.
      (async function validate() {
        if (!token) {
          document.getElementById('page-subtitle').textContent = 'Reset link missing';
          show('screen-invalid');
          return;
        }
        try {
          const res = await fetch('/api/auth/verify-reset-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
          const data = await res.json().catch(() => ({}));

          if (res.ok && data.valid) {
            document.getElementById('page-subtitle').textContent = 'Choose a strong new password for your account';
            show('screen-setpw');
            setTimeout(() => document.getElementById('new-password').focus(), 30);
          } else {
            document.getElementById('page-subtitle').textContent = 'Reset link invalid or expired';
            show('screen-invalid');
          }
        } catch (err) {
          document.getElementById('page-subtitle').textContent = 'Could not validate the link';
          document.getElementById('validating-status').textContent = 'Unable to reach the server. Please check your connection and reload.';
          document.getElementById('validating-status').style.display = 'block';
        }
      })();

      document.getElementById('reset-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const box = document.getElementById('reset-error');
        box.style.display = 'none';

        const pw = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (pw.length < 8) {
          showError('Password must be at least 8 characters long.');
          return;
        }
        if (pw !== confirm) {
          showError('Passwords do not match.');
          return;
        }

        const btn = document.getElementById('btn-submit-reset');
        btn.disabled = true;
        btn.textContent = 'Updating password...';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: pw })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.success) {
            showError(data.error || 'Unable to reset the password. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Set New Password';
            return;
          }

          // Flash alert on /login; all server sessions were revoked.
          try {
            sessionStorage.setItem('cso_password_reset_flash', '1');
            localStorage.removeItem('cso_auth_token');
            localStorage.removeItem('cso_candidate_session_v1');
            localStorage.removeItem('cso_candidate_profile');
          } catch (err) {}
          window.location.href = '/login.html';
        } catch (err) {
          showError('Unable to reach the server. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Set New Password';
        }
      });
    })();
  </script>
</body>
</html>
