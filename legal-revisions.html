<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Legal, Statutory & Compliance Revision History Log for Common Sense Odisha (csodisha.com) - Full chronological audit trail of all Folder 03 policies and statutory amendments.">
  <title>Legal Page Revision History | Common Sense Odisha</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .revisions-main {
      max-width: 960px;
      margin: 32px auto 64px;
      padding: 0 20px;
    }
    .revisions-breadcrumbs {
      font-size: 0.85rem;
      margin-bottom: 16px;
      color: var(--mut, #64748b);
    }
    .revisions-breadcrumbs a {
      color: #0fa968;
      text-decoration: none;
    }
    .revisions-breadcrumbs a:hover {
      text-decoration: underline;
    }
    .revisions-hero {
      background: var(--card, #ffffff);
      border: 1px solid var(--bd, #d8e0e8);
      border-radius: 16px;
      padding: 36px 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .revisions-badge-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .revisions-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(225, 29, 72, 0.1);
      color: #e11d48;
      border: 1px solid rgba(225, 29, 72, 0.2);
    }
    .revisions-version-badge {
      font-size: 0.75rem;
      font-family: monospace;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(15, 169, 104, 0.1);
      color: #0fa968;
      border: 1px solid rgba(15, 169, 104, 0.2);
    }
    .revisions-hero h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 34px);
      color: var(--tx, #0f172a);
      line-height: 1.25;
    }
    .revisions-meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.88rem;
      color: var(--mut, #64748b);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--bd, #e2e8f0);
    }

    .timeline-container {
      position: relative;
      padding-left: 28px;
      margin-top: 32px;
    }
    .timeline-container::before {
      content: '';
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 10px;
      width: 2px;
      background: #e2e8f0;
    }

    .timeline-item {
      position: relative;
      background: var(--card, #ffffff);
      border: 1px solid var(--bd, #d8e0e8);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 24px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      top: 24px;
      left: -24px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e11d48;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.3);
    }

    .timeline-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .timeline-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .timeline-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--tx, #0f172a);
      margin: 0;
    }
    .timeline-ver {
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(14, 165, 233, 0.1);
      color: #0284c7;
      border: 1px solid rgba(14, 165, 233, 0.2);
    }
    .timeline-date {
      font-size: 0.82rem;
      color: var(--mut, #64748b);
      font-weight: 600;
    }
    .timeline-summary {
      color: var(--mut, #475569);
      font-size: 0.92rem;
      line-height: 1.6;
      margin: 0 0 12px;
    }
    .timeline-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.8rem;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      color: var(--mut, #64748b);
    }
    .timeline-route-link {
      color: #0fa968;
      text-decoration: none;
      font-weight: 600;
    }
    .timeline-route-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .revisions-hero {
        padding: 24px 20px;
      }
      .timeline-container {
        padding-left: 20px;
      }
      .timeline-item::before {
        left: -16px;
      }
    }
  </style>
</head>
<body>
<header id="site-header"></header>

<main class="revisions-main">
  <div class="revisions-breadcrumbs">
    <a href="index.html">Home</a> &gt; <span>Legal Revision History</span>
  </div>

  <section class="revisions-hero">
    <div class="revisions-badge-group">
      <span class="revisions-badge" id="legal-rev-badge">Statutory Transparency Audit Trail</span>
      <span class="revisions-version-badge" id="legal-rev-version-badge">Version 3.0</span>
    </div>
    <h1 id="legal-rev-title">Legal &amp; Statutory Policy Revision Log</h1>
    <div class="revisions-meta-strip">
      <div><strong>Last Audited:</strong> <span id="legal-rev-last-audited">2026-11-01</span></div>
      <div><strong>Scope:</strong> Complete Historical Ledger of Folder 03 Legal Enactments</div>
    </div>
  </section>

  <!-- Timeline Container -->
  <div class="timeline-container" id="legal-revisions-timeline">
    <!-- Populated dynamically -->
  </div>
</main>

<script>
(function() {
  function escapeText(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function hydrateLegalRevisions() {
    var raw = null;
    try {
      raw = localStorage.getItem('cso_legal_revisions_config');
    } catch (_) {}

    var config = null;
    if (raw) {
      try {
        config = JSON.parse(raw);
      } catch (_) {}
    }

    if (!config || typeof config !== 'object') {
      config = {
        meta: { version: "3.0", lastEditedBy: "admin@csodisha.com", updatedAt: new Date().toISOString() },
        document: { title: "Legal & Statutory Policy Revision Log", badge: "Statutory Transparency Audit Trail", lastAudited: "2026-11-01" },
        revisions: [
          {
            id: "REV-2026-06",
            date: "2026-11-01",
            moduleName: "module-03-007 Copyright & DMCA",
            version: "v2.0",
            editor: "Legal & Redressal Cell",
            summary: "Reconciled fair dealing statutory provisions with Section 52(1)(a) of Indian Copyright Act and configured 36h DMCA redressal SLA.",
            route: "/copyright.html"
          },
          {
            id: "REV-2026-05",
            date: "2026-11-01",
            moduleName: "module-03-006 Cookie Policy",
            version: "v1.2",
            editor: "Privacy Compliance Team",
            summary: "Codified edge telemetry cookies and session token lifecycles with 365-day retention policy.",
            route: "/cookie-policy.html"
          },
          {
            id: "REV-2026-04",
            date: "2026-11-01",
            moduleName: "module-03-005 Terms & Conditions",
            version: "v2.4",
            editor: "Statutory Governance Desk",
            summary: "Formalized 5-clause terms covering acceptance of educational scope and High Court of Orissa jurisdiction.",
            route: "/terms.html"
          },
          {
            id: "REV-2026-03",
            date: "2026-11-01",
            moduleName: "module-03-004 Official Disclaimer",
            version: "v2.1",
            editor: "Legal Counsel",
            summary: "Reinforced non-affiliation notices regarding OPSC, OSSC, and OSSSC government recruitment commissions.",
            route: "/disclaimer.html"
          },
          {
            id: "REV-2026-02",
            date: "2026-11-01",
            moduleName: "module-03-003 Privacy Policy",
            version: "v2.4",
            editor: "Data Protection Officer",
            summary: "DPDP Act 2023 compliance alignment, grievance turnaround SLA (48h), and zero-commercialization pledge.",
            route: "/privacy.html"
          },
          {
            id: "REV-2026-01",
            date: "2026-10-15",
            moduleName: "module-03-001 Site Identity & Mission",
            version: "v2.0",
            editor: "Academic Directorate",
            summary: "Standardized 30-district candidate educational mission and non-profit identity standards.",
            route: "/about.html"
          }
        ]
      };
    }

    var doc = config.document || {};

    var badgeEl = document.getElementById('legal-rev-badge');
    if (badgeEl && doc.badge) badgeEl.textContent = doc.badge;

    var vBadgeEl = document.getElementById('legal-rev-version-badge');
    if (vBadgeEl && config.meta && config.meta.version) {
      vBadgeEl.textContent = "Version " + config.meta.version;
    }

    var titleEl = document.getElementById('legal-rev-title');
    if (titleEl && doc.title) titleEl.textContent = doc.title;

    var dateEl = document.getElementById('legal-rev-last-audited');
    if (dateEl && doc.lastAudited) dateEl.textContent = doc.lastAudited;

    var container = document.getElementById('legal-revisions-timeline');
    var revList = Array.isArray(config.revisions) ? config.revisions : [];
    if (container && revList.length > 0) {
      container.innerHTML = revList.map(function(rev) {
        var routeHtml = rev.route ? '<a href="' + escapeText(rev.route.replace(/^\//, '')) + '" class="timeline-route-link">View Published Policy →</a>' : '';
        return '<article class="timeline-item">' +
               '  <div class="timeline-header">' +
               '    <div class="timeline-title-wrap">' +
               '      <h2 class="timeline-title">' + escapeText(rev.moduleName || '') + '</h2>' +
               '      <span class="timeline-ver">' + escapeText(rev.version || 'v1.0') + '</span>' +
               '    </div>' +
               '    <span class="timeline-date">' + escapeText(rev.date || '') + '</span>' +
               '  </div>' +
               '  <p class="timeline-summary">' + escapeText(rev.summary || '') + '</p>' +
               '  <div class="timeline-footer">' +
               '    <div><strong>Enacted by:</strong> ' + escapeText(rev.editor || 'Legal Team') + '</div>' +
               '    ' + routeHtml +
               '  </div>' +
               '</article>';
      }).join('');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', hydrateLegalRevisions);
  } else {
    hydrateLegalRevisions();
  }

  window.addEventListener('storage', function(e) {
    if (e.key === 'cso_legal_revisions_config') {
      hydrateLegalRevisions();
    }
  });
})();
</script>
<script src="assets/cso-auth-client.js"></script>
<script src="assets/shared-header.js"></script>
</body>
</html>
