<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Candidate Frequently Asked Questions (FAQs) for Common Sense Odisha (csodisha.com) - Verified knowledgebase covering OPSC, OSSC, free syllabus downloads, and gazette verification.">
  <title>Frequently Asked Questions (FAQs) | Common Sense Odisha</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .faqs-main {
      max-width: 960px;
      margin: 32px auto 64px;
      padding: 0 20px;
    }
    .faqs-breadcrumbs {
      font-size: 0.85rem;
      margin-bottom: 16px;
      color: var(--mut, #64748b);
    }
    .faqs-breadcrumbs a {
      color: #0fa968;
      text-decoration: none;
    }
    .faqs-breadcrumbs a:hover {
      text-decoration: underline;
    }
    .faqs-hero {
      background: var(--card, #ffffff);
      border: 1px solid var(--bd, #d8e0e8);
      border-radius: 16px;
      padding: 36px 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .faqs-badge-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .faqs-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.1);
      color: #0284c7;
      border: 1px solid rgba(14, 165, 233, 0.2);
    }
    .faqs-version-badge {
      font-size: 0.75rem;
      font-family: monospace;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(15, 169, 104, 0.1);
      color: #0fa968;
      border: 1px solid rgba(15, 169, 104, 0.2);
    }
    .faqs-hero h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 34px);
      color: var(--tx, #0f172a);
      line-height: 1.25;
    }
    .faqs-meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.88rem;
      color: var(--mut, #64748b);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--bd, #e2e8f0);
    }

    .faqs-filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--bd, #d8e0e8);
      background: var(--card, #ffffff);
      color: var(--mut, #475569);
      transition: all 0.15s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #0fa968;
      color: #ffffff;
      border-color: #0fa968;
    }

    .faq-card {
      background: var(--card, #ffffff);
      border: 1px solid var(--bd, #d8e0e8);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      transition: border-color 0.15s ease;
    }
    .faq-card:hover {
      border-color: #0fa968;
    }
    .faq-card summary {
      padding: 20px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--tx, #0f172a);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
      list-style: none;
    }
    .faq-card summary::-webkit-details-marker {
      display: none;
    }
    .faq-card summary::after {
      content: '+';
      font-size: 1.3rem;
      color: #0fa968;
      font-weight: bold;
      transition: transform 0.2s ease;
    }
    .faq-card[open] summary::after {
      content: '−';
    }
    .faq-content {
      padding: 0 24px 20px;
      color: var(--mut, #475569);
      font-size: 0.95rem;
      line-height: 1.65;
      border-top: 1px solid #f1f5f9;
      padding-top: 14px;
    }
    .faq-cat-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #64748b;
      margin-right: 8px;
    }

    @media (max-width: 640px) {
      .faqs-hero {
        padding: 24px 20px;
      }
      .faq-card summary {
        padding: 16px 18px;
        font-size: 0.95rem;
      }
      .faq-content {
        padding: 0 18px 16px;
      }
    }
  </style>
</head>
<body>
<header id="site-header"></header>

<main class="faqs-main">
  <div class="faqs-breadcrumbs">
    <a href="index.html">Home</a> &gt; <span>Frequently Asked Questions</span>
  </div>

  <section class="faqs-hero">
    <div class="faqs-badge-group">
      <span class="faqs-badge" id="faqs-badge">Verified Academic Knowledgebase</span>
      <span class="faqs-version-badge" id="faqs-version-badge">Version 2.0</span>
    </div>
    <h1 id="faqs-title">Candidate Frequently Asked Questions</h1>
    <div class="faqs-meta-strip">
      <div><strong>Last Reviewed:</strong> <span id="faqs-last-reviewed">2026-11-01</span></div>
      <div><strong>Reconciliation Cycle:</strong> Reconciled against Odisha Official Gazettes &amp; Commission Releases</div>
    </div>
  </section>

  <!-- Filter Pills -->
  <div class="faqs-filter-pills" id="faqs-category-pills">
    <button class="filter-btn active" data-cat="all">All Questions</button>
  </div>

  <!-- FAQs Accordion Container -->
  <div id="faqs-accordion-container">
    <!-- Populated dynamically -->
  </div>
</main>

<script>
(function() {
  function escapeText(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  var activeCategory = 'all';

  function hydrateFaqs() {
    var raw = null;
    try {
      raw = localStorage.getItem('cso_faqs_config');
    } catch (_) {}

    var config = null;
    if (raw) {
      try {
        config = JSON.parse(raw);
      } catch (_) {}
    }

    if (!config || typeof config !== 'object') {
      config = {
        meta: { version: "2.0", lastEditedBy: "admin@csodisha.com", updatedAt: new Date().toISOString() },
        document: { title: "Candidate Frequently Asked Questions", badge: "Verified Academic Knowledgebase", lastReviewed: "2026-11-01" },
        categories: ["General", "OPSC / OSSC Exams", "Syllabus Verification", "Technical Access", "Grievance Desk"],
        items: [
          { id: "FAQ-01", question: "Is Common Sense Odisha an official government portal?", answer: "No. Common Sense Odisha is an independent civic and educational intelligence gateway. We synthesize official Odisha Gazette publications and commission releases to assist aspirants across all 30 districts.", category: "General", active: true },
          { id: "FAQ-02", question: "Are study materials and syllabus breakdowns 100% free?", answer: "Yes. All digital materials, syllabus roadmaps, and PYQ analysis tools are delivered completely free without subscription paywalls.", category: "Syllabus Verification", active: true },
          { id: "FAQ-03", question: "How often are examination updates verified against official gazettes?", answer: "Our academic editorial desk runs reconciliation scans within 24 hours of any formal gazette notification released by OPSC, OSSC, OSSSC, or BSE Odisha.", category: "OPSC / OSSC Exams", active: true },
          { id: "FAQ-04", question: "Who do I contact if I discover a discrepancy in syllabus markings?", answer: "Aspirants can submit errata directly to corrections@csodisha.com or through our Corrections Desk under module-03-009.", category: "Grievance Desk", active: true }
        ]
      };
    }

    var doc = config.document || {};

    var badgeEl = document.getElementById('faqs-badge');
    if (badgeEl && doc.badge) badgeEl.textContent = doc.badge;

    var vBadgeEl = document.getElementById('faqs-version-badge');
    if (vBadgeEl && config.meta && config.meta.version) {
      vBadgeEl.textContent = "Version " + config.meta.version;
    }

    var titleEl = document.getElementById('faqs-title');
    if (titleEl && doc.title) titleEl.textContent = doc.title;

    var dateEl = document.getElementById('faqs-last-reviewed');
    if (dateEl && doc.lastReviewed) dateEl.textContent = doc.lastReviewed;

    // Categories
    var catContainer = document.getElementById('faqs-category-pills');
    var catList = Array.isArray(config.categories) ? config.categories : ["General"];
    if (catContainer) {
      var pillsHtml = '<button class="filter-btn ' + (activeCategory === 'all' ? 'active' : '') + '" data-cat="all">All Questions</button>';
      catList.forEach(function(c) {
        var isAct = activeCategory === c ? 'active' : '';
        pillsHtml += '<button class="filter-btn ' + isAct + '" data-cat="' + escapeText(c) + '">' + escapeText(c) + '</button>';
      });
      catContainer.innerHTML = pillsHtml;

      catContainer.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          activeCategory = this.getAttribute('data-cat') || 'all';
          hydrateFaqs();
        });
      });
    }

    // Accordion Items
    var container = document.getElementById('faqs-accordion-container');
    var allItems = Array.isArray(config.items) ? config.items.filter(function(i) { return i.active !== false; }) : [];
    var filtered = activeCategory === 'all' ? allItems : allItems.filter(function(i) { return (i.category || '').toLowerCase() === activeCategory.toLowerCase(); });

    if (container) {
      if (filtered.length === 0) {
        container.innerHTML = '<div style="padding:32px; text-align:center; color:#64748b; background:#ffffff; border:1px solid #e2e8f0; border-radius:12px;">No questions found in this category.</div>';
      } else {
        container.innerHTML = filtered.map(function(item) {
          return '<details class="faq-card">' +
                 '  <summary>' +
                 '    <span><span class="faq-cat-badge">' + escapeText(item.category || 'General') + '</span>' + escapeText(item.question || '') + '</span>' +
                 '  </summary>' +
                 '  <div class="faq-content">' + escapeText(item.answer || '') + '</div>' +
                 '</details>';
        }).join('');
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', hydrateFaqs);
  } else {
    hydrateFaqs();
  }

  window.addEventListener('storage', function(e) {
    if (e.key === 'cso_faqs_config') {
      hydrateFaqs();
    }
  });
})();
</script>
<script src="assets/cso-auth-client.js"></script>
<script src="assets/shared-header.js"></script>
</body>
</html>
